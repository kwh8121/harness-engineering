# H0 — Single. 에이전트 0개.
# 입력: "프로필 페이지 저장 버튼 색상을 브랜드 파란색으로 바꿔줘"
harness_version: 1

task:
  goal: 프로필 페이지 저장 버튼의 배경색을 브랜드 파란색 토큰으로 교체한다
  scope: [frontend]
  constraints: ["하드코딩 대신 기존 색상 토큰을 쓴다"]
  acceptance_criteria:
    - 저장 버튼이 브랜드 파란색 토큰을 사용한다
    - 기존 lint/typecheck/test/build 가 전부 통과한다
  known_risks: []
  target_environment: local

profile:
  scope: single
  coupling: low
  parallelism: none
  uncertainty: low
  risk: low
  side_effect: none

harness:
  level: H0
  pattern: single
  rationale: >-
    단일 파일의 표현 계층 변경이고 동작이 바뀌지 않는다. 게이트(lint/typecheck/build)가
    회귀를 전부 잡아내므로 독립 리뷰어의 추가 가치가 게이트를 넘지 못한다 — 그래서 H1 이 아니다.

agents: []
controller_skills: [superpowers:verification-before-completion]
agent_skills: {}
context: {}

verification:
  gates_tsv: _workspace/harness/gates.tsv
  local: [fast, feature]   # H0 라도 테스트(feature)를 건너뛰지 않는다.
                           # 수용 기준의 "test 통과"를 확인하는 tier 가 여기 있어야 한다.
  final: [final]
  manual: ["변경된 버튼을 육안으로 확인 (색상은 게이트가 판정할 수 없다)"]

review_policy:
  blocking: [BLOCKER, MAJOR]
  max_loops: 2
  escalation_after: 2

parallelism:
  enabled: false
  max_workers: 1

human_gate:
  required: false

tracking:
  provider: none         # H0 은 추적하지 않는다 — 단일 파일 표현 계층 변경까지 이슈로 만들지 않는다

escalation:
  if_implementation_error: implementer
  if_gate_fails_repeatedly: superpowers:systematic-debugging
